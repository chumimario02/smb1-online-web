<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>SMB1R</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #000000;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>

<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--false fullsize--false use-filter--false" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":56163148,"index.wasm":37902138},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG); window.godotEngine = engine;

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	<!-- SMB1R Online web overlay: ROM picker (opens the system file explorer),
     fullscreen toggle and on-screen touch controls. -->
<style>
  #smbUI, #smbUI * { box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #smbUI { position: fixed; inset: 0; pointer-events: none; z-index: 99999; }
  #smbTop { position: absolute; top: 10px; right: 10px; display: flex; gap: 8px; pointer-events: auto; }
  #smbTop button {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 12px; border-radius: 10px; cursor: pointer;
    background: rgba(12, 14, 20, .82); color: #eef1f8; border: 1px solid rgba(255,255,255,.18);
    font-size: 13px; font-weight: 600; backdrop-filter: blur(6px);
  }
  #smbTop button:hover { background: rgba(30, 34, 46, .95); }
  #smbTop button.primary { background: #e52521; border-color: #ff6a63; }
  #smbTop button.primary:hover { background: #f02d29; }

  #smbTouch { position: absolute; inset: 0; display: none; pointer-events: none; }
  #smbTouch.on { display: block; }
  .smbPad { position: absolute; bottom: 22px; display: grid; gap: 10px; pointer-events: auto; }
  #smbDpad { left: 20px; grid-template-columns: 64px 64px 64px; grid-template-rows: 64px 64px; }
  #smbButtons { right: 20px; grid-template-columns: 72px 72px; grid-template-rows: 72px 72px; align-items: end; }
  .smbBtn {
    -webkit-user-select: none; user-select: none; touch-action: none;
    display: grid; place-items: center;
    width: 64px; height: 64px; border-radius: 14px;
    background: rgba(15, 18, 27, .72); border: 2px solid rgba(255,255,255,.22);
    color: #fff; font-size: 24px; font-weight: 800;
    box-shadow: 0 6px 18px -8px rgba(0,0,0,.9);
  }
  .smbBtn:active { background: rgba(229, 37, 33, .75); transform: scale(.96); }
  .smbRound { border-radius: 50%; width: 72px; height: 72px; font-size: 20px; }
  #smbA { background: rgba(229,37,33,.72); border-color: #ff8b86; grid-column: 2; grid-row: 1; }
  #smbB { background: rgba(4,156,216,.72); border-color: #8fd8f7; grid-column: 1; grid-row: 2; }
  #smbStart { width: auto; height: 44px; padding: 0 18px; font-size: 13px; letter-spacing: .08em; grid-column: 1 / span 2; }
  .smbHint { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,.45); font-size: 11px; }
  #smbRomMsg { position: absolute; top: 58px; right: 10px; max-width: 320px; padding: 10px 12px; border-radius: 10px; background: rgba(12,14,20,.92); border: 1px solid rgba(255,255,255,.18); color: #ffe9a3; font-size: 12.5px; display: none; }
</style>

<div id="smbUI">
  <div id="smbTop">
    <button id="smbRom" class="primary" title="Cargar tu ROM de SMB1 (.nes)">📁 ROM</button>
    <button id="smbFull" title="Pantalla completa">⛶ Pantalla completa</button>
    <button id="smbToggle" title="Mostrar/ocultar controles táctiles">🎮 Controles</button>
  </div>
  <div id="smbRomMsg"></div>

  <div id="smbTouch">
    <div class="smbPad" id="smbDpad">
      <div></div>
      <div class="smbBtn" data-k="up">▲</div>
      <div></div>
      <div class="smbBtn" data-k="left">◀</div>
      <div class="smbBtn" data-k="down">▼</div>
      <div class="smbBtn" data-k="right">▶</div>
    </div>
    <div class="smbPad" id="smbButtons">
      <div class="smbBtn smbRound" id="smbA" data-k="a">A</div>
      <div class="smbBtn smbRound" id="smbB" data-k="b">B</div>
      <div class="smbBtn" id="smbStart" data-k="start">START</div>
    </div>
    <div class="smbHint">Arrastra para moverte · A = saltar · B = correr/fuego</div>
  </div>
</div>

<input type="file" id="smbRomFile" accept=".nes,.NES,.nez,.unf,.unif" style="display:none">

<script>
(function () {
  var KEYS = {
    left:  { keyCode: 37, key: "ArrowLeft",  code: "ArrowLeft" },
    right: { keyCode: 39, key: "ArrowRight", code: "ArrowRight" },
    up:    { keyCode: 38, key: "ArrowUp",    code: "ArrowUp" },
    down:  { keyCode: 40, key: "ArrowDown",  code: "ArrowDown" },
    a:     { keyCode: 90, key: "z",          code: "KeyZ" },
    b:     { keyCode: 88, key: "x",          code: "KeyX" },
    start: { keyCode: 13, key: "Enter",      code: "Enter" }
  };

  function toast(text, ms) {
    var el = document.getElementById("smbRomMsg");
    el.textContent = text;
    el.style.display = "block";
    if (ms) setTimeout(function () { el.style.display = "none"; }, ms);
  }

  function fire(name, down) {
    var k = KEYS[name];
    if (!k) return;
    var targets = [document.getElementById("canvas"), document, window];
    targets.forEach(function (t) {
      if (!t) return;
      t.dispatchEvent(new KeyboardEvent(down ? "keydown" : "keyup", {
        key: k.key, code: k.code, keyCode: k.keyCode, which: k.keyCode,
        bubbles: true, cancelable: true
      }));
    });
  }

  document.querySelectorAll("[data-k]").forEach(function (el) {
    var name = el.getAttribute("data-k");
    var press = function (e) { e.preventDefault(); el.setPointerCapture && e.pointerId !== undefined && el.setPointerCapture(e.pointerId); fire(name, true); };
    var release = function (e) { e.preventDefault(); fire(name, false); };
    el.addEventListener("pointerdown", press);
    el.addEventListener("pointerup", release);
    el.addEventListener("pointercancel", release);
    el.addEventListener("pointerleave", release);
    el.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  });

  var touch = document.getElementById("smbTouch");
  document.getElementById("smbToggle").addEventListener("click", function () {
    touch.classList.toggle("on");
    try { localStorage.setItem("smb_touch", touch.classList.contains("on") ? "1" : "0"); } catch (e) {}
  });

  var full = document.getElementById("smbFull");
  full.addEventListener("click", function () {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      var root = document.documentElement;
      var req = root.requestFullscreen || root.webkitRequestFullscreen;
      if (req) req.call(root).catch(function () {});
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    }
  });
  document.addEventListener("fullscreenchange", function () {
    full.textContent = document.fullscreenElement ? "⛶ Salir" : "⛶ Pantalla completa";
  });

  var input = document.getElementById("smbRomFile");
  document.getElementById("smbRom").addEventListener("click", function () {
    input.value = "";
    input.click();
  });
  input.addEventListener("change", async function () {
    var file = input.files && input.files[0];
    if (!file) return;
    var engine = window.godotEngine;
    if (!engine || typeof engine.copyToFS !== "function") {
      toast("El juego todavía está cargando. Espera unos segundos y vuelve a intentarlo.", 6000);
      return;
    }
    try {
      toast("Cargando ROM…");
      var bytes = new Uint8Array(await file.arrayBuffer());
      var result = engine.copyToFS("/userfs/baserom.nes", bytes);
      if (result && typeof result.then === "function") await result;
      toast("ROM cargada. Reiniciando…", 4000);
      setTimeout(function () { location.reload(); }, 700);
    } catch (err) {
      console.error(err);
      toast("No se pudo guardar la ROM: " + err, 8000);
    }
  });

  // Touch controls on by default on phones/tablets, or if the user enabled them.
  var isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
  var saved = null;
  try { saved = localStorage.getItem("smb_touch"); } catch (e) {}
  if (saved === "1" || (isTouch && saved !== "0")) touch.classList.add("on");

  // If the game shows the ROM screen, point people to the button.
  setTimeout(function () {
    if (!window.godotEngine) return;
    toast("¿Te pide la ROM? Pulsa 📁 ROM y elige tu archivo .nes", 9000);
  }, 12000);
})();
</script>
